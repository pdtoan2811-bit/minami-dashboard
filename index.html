<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0b" />
<title>Minami Dashboard</title>
<style>
  :root{
    --bg:#0a0a0b; --panel:#121214; --panel-2:#17171a; --border:#26262b;
    --fg:#ededef; --muted:#9a9aa3; --faint:#6b6b73;
    --pink:#f6a5c0; --pink-soft:rgba(246,165,192,.14);
    --green:#4ade80; --amber:#fbbf24; --blue:#60a5fa; --red:#f87171; --violet:#a78bfa;
    --radius:16px; --radius-sm:10px;
    font-synthesis:none; -webkit-text-size-adjust:100%;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased}
  body{max-width:760px; margin:0 auto; padding:20px 16px calc(48px + env(safe-area-inset-bottom))}
  a{color:inherit; text-decoration:none}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  /* header */
  header{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .logo{width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
    background:var(--pink-soft); font-size:20px; flex:none}
  h1{font-size:20px; font-weight:650; letter-spacing:-.01em}
  .sub{font-size:12.5px; color:var(--muted); margin-top:1px}
  .refreshed{font-size:11.5px; color:var(--faint); margin:14px 0 22px}
  .refreshed b{color:var(--muted); font-weight:600}
  /* section */
  section{margin-bottom:26px}
  .sec-h{display:flex; align-items:baseline; gap:8px; margin:0 2px 12px}
  .sec-h h2{font-size:12px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .sec-h .dot{width:5px; height:5px; border-radius:50%; background:var(--pink); flex:none; transform:translateY(-2px)}
  .sec-h .count{font-size:11.5px; color:var(--faint); margin-left:auto}
  /* cards */
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px}
  .grid{display:grid; gap:10px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 15px}
  .stat .n{font-size:26px; font-weight:680; letter-spacing:-.02em; line-height:1}
  .stat .l{font-size:11.5px; color:var(--muted); margin-top:6px}
  .stat .bar{display:flex; gap:3px; margin-top:11px; height:5px; border-radius:3px; overflow:hidden}
  .stat .bar i{display:block; height:100%}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:11px; font-size:11px; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:5px}
  .legend b{width:8px; height:8px; border-radius:2px; display:inline-block}
  /* task group */
  .proj{margin-bottom:12px}
  .proj:last-child{margin-bottom:0}
  .proj-h{display:flex; align-items:center; gap:8px; padding:0 2px 8px}
  .proj-h .name{font-size:13.5px; font-weight:620}
  .proj-h .tag{font-size:10.5px; color:var(--faint); background:var(--panel-2); border:1px solid var(--border);
    padding:1px 7px; border-radius:20px}
  .task{display:flex; align-items:flex-start; gap:10px; padding:11px 14px; background:var(--panel);
    border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:7px}
  .task:last-child{margin-bottom:0}
  .task .mark{width:16px; height:16px; border-radius:5px; border:1.5px solid var(--faint); flex:none; margin-top:2px}
  .task.done .mark{background:var(--green); border-color:var(--green)}
  .task.prog .mark{background:transparent; border-color:var(--blue); box-shadow:inset 0 0 0 3px var(--blue)}
  .task .body{flex:1; min-width:0}
  .task .t{font-size:13.5px}
  .task.done .t{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--faint)}
  .task .meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center}
  .badge{font-size:10px; font-weight:600; padding:1.5px 7px; border-radius:20px; letter-spacing:.02em}
  .b-done{color:var(--green); background:rgba(74,222,128,.12)}
  .b-prog{color:var(--blue); background:rgba(96,165,250,.12)}
  .b-back{color:var(--muted); background:rgba(154,154,163,.1)}
  .p-urgent{color:var(--red); background:rgba(248,113,113,.12)}
  .p-high{color:var(--amber); background:rgba(251,191,36,.12)}
  .p-medium{color:var(--faint); background:rgba(154,154,163,.09)}
  .due{font-size:10.5px; color:var(--faint)}
  .due.soon{color:var(--amber)}
  .id{font-size:10.5px; color:var(--faint); font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  /* trace */
  .trace{display:flex; align-items:center; gap:8px; padding:12px 14px; background:var(--panel);
    border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; flex-wrap:wrap}
  .trace:last-child{margin-bottom:0}
  .trace .node{font-size:12px; padding:3px 9px; border-radius:8px; background:var(--panel-2); border:1px solid var(--border); white-space:nowrap}
  .trace .node.k{color:var(--pink); background:var(--pink-soft); border-color:transparent}
  .trace .arrow{color:var(--faint); font-size:11px}
  .trace .title{flex-basis:100%; font-size:13px; font-weight:600; margin-bottom:2px}
  /* people */
  .person{display:flex; gap:12px; padding:13px 14px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius-sm); margin-bottom:8px}
  .person:last-child{margin-bottom:0}
  .av{width:38px; height:38px; border-radius:11px; flex:none; display:grid; place-items:center;
    font-weight:650; font-size:14px; color:var(--bg)}
  .person .n{font-size:13.5px; font-weight:620}
  .person .r{font-size:12px; color:var(--muted); margin-top:1px}
  .person .links{margin-top:6px; display:flex; flex-wrap:wrap; gap:8px}
  .person .links a{font-size:11px; color:var(--pink)}
  /* empty */
  .empty{text-align:center; padding:26px 16px; color:var(--muted)}
  .empty .ic{font-size:26px; opacity:.5}
  .empty .h{font-size:13.5px; font-weight:600; margin-top:8px; color:var(--fg)}
  .empty .p{font-size:12px; margin-top:4px}
  footer{margin-top:34px; padding-top:18px; border-top:1px solid var(--border);
    font-size:11px; color:var(--faint); text-align:center; line-height:1.7}
  footer code{background:var(--panel-2); padding:1px 6px; border-radius:5px; font-size:10.5px}
</style>
</head>
<body>
<header>
  <div class="logo">&#127800;</div>
  <div>
    <h1>Minami Dashboard</h1>
    <div class="sub">Companion view of anh Toàn&#39;s Second Brain</div>
  </div>
</header>
<div class="refreshed">Snapshot &middot; <b>24 Jul 2026</b> &middot; live data from qone + vault</div>

<div id="app"></div>

<footer>
  Static snapshot &mdash; regenerated by Minami on request (&ldquo;update dashboard&rdquo;).<br/>
  Source: <code>pdtoan2811-bit/minami-dashboard</code> &middot; built from qone + Second Brain vault.
</footer>

<script>
const DATA = {
  stats: { projects:4, tasks:12, done:4, prog:4, back:4, thisWeek:2 },
  projects: [
    { id:"minami", name:"Minami", tag:"the bot", tasks:[
      { id:"minami-3", t:"Minami Dashboard — visual UI (token/task log, trace-back, analytics, people)", s:"back", p:"high", due:"2026-07-31" },
      { id:"minami-1", t:"Test Minami → qone wiring", s:"done", p:"high" },
      { id:"minami-2", t:"Verify durable qone auth", s:"done", p:"medium" },
    ]},
    { id:"qone-ops", name:"Qone Ops", tag:"tenants", tasks:[
      { id:"qone-ops-1", t:"Contact NTQ (ntq.com.vn) qone trial tenant", s:"prog", p:"medium" },
      { id:"qone-ops-2", t:"Set up “ntq-solution” tenant", s:"prog", p:"medium" },
      { id:"qone-ops-4", t:"Test-drive the PM Agent", s:"prog", p:"medium" },
      { id:"qone-ops-6", t:"Auto-assign task feedback for AI-feature tenants", s:"back", p:"medium" },
      { id:"qone-ops-3", t:"Finish qone account login + setup (Toàn)", s:"done", p:"high" },
    ]},
    { id:"qmember", name:"Qmember", tag:"blocked", tasks:[
      { id:"qmember-1", t:"Get test store access for Qmember", s:"back", p:"high" },
      { id:"qmember-2", t:"Get Qmember repo access (awaiting grant)", s:"back", p:"high", due:"2026-07-28" },
    ]},
    { id:"qsortby", name:"QSortby", tag:"shipped", tasks:[
      { id:"qsortby7721-2", t:"Slack bot to relay Shopify app-review emails", s:"prog", p:"medium" },
      { id:"qsortby7721-1", t:"Respond to Shopify app-review feedback (Partner Dashboard)", s:"done", p:"urgent" },
    ]},
  ],
  trace: [
    { title:"Minami Dashboard", chain:["this chat","capture","10-19 Projects/minami-dashboard.md","qone: minami-3"] },
    { title:"Minami (the bot)", chain:["Slack DM","capture","10-19 Projects/minami.md","qone: minami"] },
    { title:"QSortby", chain:["shipped","note","10-19 Projects/qsortby.md","qone: qsortby7721"] },
    { title:"Ecom Intel — the bet", chain:["idea seed","note","10-19 Projects/ecom-intel.md"] },
  ],
  people: [
    { n:"Ownego / Qikify", r:"Hanoi Shopify product company — anh leads Product & Growth; backer of Ecom Intel", c:"#f6a5c0",
      links:[{l:"ownego.com",u:"https://ownego.com"},{l:"qikify.com",u:"https://qikify.com"}] },
    { n:"Ecom Intel", r:"Anh’s startup — Commerce360 brand-intelligence (the bet)", c:"#a78bfa", links:[] },
    { n:"QDN Digital", r:"Separate org anh helps — kept firewalled from Ownego", c:"#60a5fa", links:[] },
    { n:"NTQ / ntq-solution", r:"qone trial tenants in flight (Qone Ops)", c:"#4ade80", links:[] },
  ],
};

const S = { done:{b:"b-done",l:"Done"}, prog:{b:"b-prog",l:"In progress"}, back:{b:"b-back",l:"Backlog"} };
const P = { urgent:{b:"p-urgent",l:"Urgent"}, high:{b:"p-high",l:"High"}, medium:{b:"p-medium",l:"Medium"} };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function taskRow(t){
  const cls = t.s==="done"?"done":t.s==="prog"?"prog":"";
  const due = t.due ? `<span class="due ${new Date(t.due) < new Date('2026-07-29') && t.s!=='done' ? 'soon':''}">&#128197; ${t.due}</span>` : "";
  return `<div class="task ${cls}"><div class="mark"></div><div class="body">
    <div class="t">${esc(t.t)}</div>
    <div class="meta">
      <span class="badge ${S[t.s].b}">${S[t.s].l}</span>
      <span class="badge ${P[t.p].b}">${P[t.p].l}</span>
      ${due}<span class="id">${t.id}</span>
    </div></div></div>`;
}

function render(){
  const d = DATA, st = d.stats;
  let h = "";

  // analytics
  h += `<section><div class="sec-h"><span class="dot"></span><h2>Analytics</h2></div>
    <div class="grid stats">
      <div class="stat"><div class="n">${st.projects}</div><div class="l">Active projects</div></div>
      <div class="stat"><div class="n">${st.tasks}</div><div class="l">Tasks tracked</div>
        <div class="bar">
          <i style="flex:${st.done};background:var(--green)"></i>
          <i style="flex:${st.prog};background:var(--blue)"></i>
          <i style="flex:${st.back};background:var(--faint)"></i>
        </div>
        <div class="legend">
          <span><b style="background:var(--green)"></b>${st.done} done</span>
          <span><b style="background:var(--blue)"></b>${st.prog} in progress</span>
          <span><b style="background:var(--faint)"></b>${st.back} backlog</span>
        </div>
      </div>
    </div></section>`;

  // task log
  h += `<section><div class="sec-h"><span class="dot"></span><h2>Task Log</h2><span class="count">${st.tasks} across ${st.projects}</span></div>`;
  d.projects.forEach(p => {
    h += `<div class="proj"><div class="proj-h"><span class="name">${esc(p.name)}</span><span class="tag">${esc(p.tag)}</span></div>`;
    p.tasks.forEach(t => h += taskRow(t));
    h += `</div>`;
  });
  h += `</section>`;

  // trace-back
  h += `<section><div class="sec-h"><span class="dot"></span><h2>Trace-back</h2></div>`;
  d.trace.forEach(tr => {
    h += `<div class="trace"><div class="title">${esc(tr.title)}</div>`;
    tr.chain.forEach((n,i) => {
      const k = i===tr.chain.length-1 ? "node k" : "node";
      h += `${i?'<span class="arrow">&rarr;</span>':''}<span class="${k}">${esc(n)}</span>`;
    });
    h += `</div>`;
  });
  h += `</section>`;

  // token log (empty state)
  h += `<section><div class="sec-h"><span class="dot"></span><h2>Token Log</h2></div>
    <div class="card"><div class="empty">
      <div class="ic">&#9889;</div>
      <div class="h">Wiring up</div>
      <div class="p">Per-session token &amp; cost will stream here once Minami&#39;s runtime logging is turned on.</div>
    </div></div></section>`;

  // people
  h += `<section><div class="sec-h"><span class="dot"></span><h2>People &amp; Orgs Around Me</h2></div>`;
  d.people.forEach(pn => {
    const init = pn.n.split(/[ \/]/).filter(Boolean).slice(0,2).map(w=>w[0]).join("");
    const links = pn.links.map(l=>`<a href="${l.u}">${esc(l.l)} &#8599;</a>`).join("");
    h += `<div class="person"><div class="av" style="background:${pn.c}">${esc(init)}</div>
      <div><div class="n">${esc(pn.n)}</div><div class="r">${esc(pn.r)}</div>
      ${links?`<div class="links">${links}</div>`:""}</div></div>`;
  });
  h += `</section>`;

  document.getElementById("app").innerHTML = h;
}
render();
</script>
</body>
</html>
